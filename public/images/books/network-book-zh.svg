<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" width="1600" height="2400" font-family="'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03120f"/>
      <stop offset="46%" stop-color="#062318"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="23%" cy="16%" r="58%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="48%" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="78%" cy="76%" r="58%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.23"/>
      <stop offset="52%" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="18%" stop-color="#34d399" stop-opacity="0.74"/>
      <stop offset="58%" stop-color="#38bdf8" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="networkFlow" x1="0%" y1="82%" x2="100%" y2="12%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.92"/>
      <stop offset="42%" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="quietFlow" x1="0%" y1="60%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0"/>
      <stop offset="44%" stop-color="#10b981" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.08"/>
    </pattern>
    <pattern id="microGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#64748b" stroke-width="0.7" opacity="0.065"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <filter id="flowBlur" x="-20%" y="-35%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="2400" fill="url(#coverBg)"/>
  <rect width="1600" height="2400" fill="url(#greenGlow)"/>
  <rect width="1600" height="2400" fill="url(#blueGlow)"/>
  <rect width="1600" height="2400" fill="url(#grid)"/>
  <rect width="1600" height="2400" fill="url(#microGrid)" opacity="0.56"/>

  <g opacity="0.34">
    <path d="M80 1810 C360 1668, 590 1752, 840 1568 C1040 1420, 1230 1404, 1520 1244" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.25"/>
    <path d="M120 1932 C410 1772, 650 1842, 925 1628 C1135 1464, 1310 1476, 1530 1364" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.20"/>
    <path d="M92 2048 C390 1888, 665 1974, 972 1706 C1200 1514, 1390 1554, 1540 1444" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.15"/>
  </g>

  <g transform="translate(140 132)">
    <text x="0" y="0" fill="#86efac" font-family="'SFMono-Regular', 'Cascadia Code', 'Menlo', monospace" font-size="30" font-weight="700" letter-spacing="5">CLOUD NETWORK</text>
    <line x1="0" y1="48" x2="1320" y2="48" stroke="url(#lineGrad)" stroke-width="3"/>
    <text x="1320" y="0" text-anchor="end" fill="#94a3b8" font-family="'SFMono-Regular', 'Cascadia Code', 'Menlo', monospace" font-size="24" letter-spacing="3">ISOLATION → CONNECTION</text>
  </g>

  <g transform="translate(140 392)">
    <text x="0" y="0" fill="url(#titleGrad)" font-size="136" font-weight="850" letter-spacing="-8">云网络：</text>
    <text x="0" y="172" fill="url(#titleGrad)" font-size="162" font-weight="900" letter-spacing="-9">从隔离到连接</text>
    <rect x="4" y="232" width="860" height="8" rx="4" fill="url(#lineGrad)"/>
    <text x="0" y="336" fill="#cbd5e1" font-size="52" font-weight="500" letter-spacing="1.6">从物理网络到云原生网络的演进之旅</text>
  </g>

  <g transform="translate(74 820)" filter="url(#softShadow)">
    <ellipse cx="750" cy="390" rx="660" ry="330" fill="#10b981" fill-opacity="0.055"/>
    <ellipse cx="870" cy="370" rx="560" ry="260" fill="#38bdf8" fill-opacity="0.045"/>
    <ellipse cx="500" cy="520" rx="430" ry="210" fill="#34d399" fill-opacity="0.035"/>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M126 568 C260 368, 392 314, 542 348 C684 380, 716 536, 864 572 C1036 614, 1134 456, 1224 310 C1304 180, 1390 148, 1490 176" stroke="url(#networkFlow)" stroke-width="58" stroke-opacity="0.15" filter="url(#flowBlur)"/>
      <path d="M126 568 C260 368, 392 314, 542 348 C684 380, 716 536, 864 572 C1036 614, 1134 456, 1224 310 C1304 180, 1390 148, 1490 176" stroke="url(#networkFlow)" stroke-width="13" stroke-opacity="0.72" filter="url(#glow)"/>
      <path d="M126 568 C260 368, 392 314, 542 348 C684 380, 716 536, 864 572 C1036 614, 1134 456, 1224 310 C1304 180, 1390 148, 1490 176" stroke="#ecfeff" stroke-width="2" stroke-opacity="0.50"/>
      <path d="M126 646 C316 500, 460 492, 614 570 C790 660, 936 690, 1108 548 C1228 450, 1348 392, 1500 418" stroke="url(#quietFlow)" stroke-width="4" stroke-opacity="0.62"/>
      <path d="M260 282 C404 214, 564 224, 704 310 C850 400, 968 400, 1110 284 C1218 196, 1324 126, 1452 122" stroke="url(#quietFlow)" stroke-width="3" stroke-opacity="0.54"/>
    </g>

    <g opacity="0.52" fill="none" stroke-linecap="round">
      <path d="M152 510 L222 474" stroke="#34d399" stroke-width="1.8"/>
      <path d="M210 610 L288 562" stroke="#34d399" stroke-width="1.8"/>
      <path d="M372 386 L474 424 L556 354" stroke="#86efac" stroke-width="2"/>
      <path d="M666 454 L780 530 L882 574 L976 548" stroke="#67e8f9" stroke-width="2"/>
      <path d="M1114 452 L1230 310 L1340 236 L1490 176" stroke="#a5b4fc" stroke-width="2"/>
      <path d="M1230 310 L1338 394 L1498 418" stroke="#38bdf8" stroke-width="1.8"/>
      <path d="M1340 236 L1408 320 L1498 418" stroke="#c4b5fd" stroke-width="1.6"/>
    </g>

    <g opacity="0.55">
      <circle cx="116" cy="620" r="6" fill="#86efac"/>
      <circle cx="176" cy="496" r="5" fill="#34d399"/>
      <circle cx="242" cy="600" r="4" fill="#86efac"/>
      <circle cx="306" cy="458" r="5" fill="#34d399"/>
      <circle cx="386" cy="334" r="4" fill="#bbf7d0"/>
      <circle cx="514" cy="458" r="4" fill="#67e8f9"/>
      <circle cx="652" cy="526" r="4" fill="#67e8f9"/>
      <circle cx="1016" cy="650" r="4" fill="#38bdf8"/>
      <circle cx="1118" cy="520" r="5" fill="#7dd3fc"/>
      <circle cx="1300" cy="444" r="4" fill="#c4b5fd"/>
      <circle cx="1424" cy="302" r="5" fill="#a78bfa"/>
    </g>

    <g filter="url(#glow)">
      <g transform="translate(126 568)">
        <circle r="24" fill="#064e3b" fill-opacity="0.62" stroke="#86efac" stroke-width="2.2" stroke-opacity="0.72"/>
        <circle r="7" fill="#dcfce7"/>
      </g>
      <g transform="translate(310 392)">
        <circle r="30" fill="#064e3b" fill-opacity="0.54" stroke="#86efac" stroke-width="2.2" stroke-opacity="0.74"/>
        <circle r="8" fill="#bbf7d0"/>
      </g>
      <g transform="translate(542 348)">
        <circle r="34" fill="#065f46" fill-opacity="0.48" stroke="#34d399" stroke-width="2.4" stroke-opacity="0.78"/>
        <circle r="9" fill="#86efac"/>
      </g>
      <g transform="translate(720 538)">
        <circle r="38" fill="#083344" fill-opacity="0.42" stroke="#67e8f9" stroke-width="2.4" stroke-opacity="0.76"/>
        <circle r="10" fill="#a5f3fc"/>
      </g>
      <g transform="translate(864 572)">
        <circle r="42" fill="#082f49" fill-opacity="0.40" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.78"/>
        <circle r="11" fill="#7dd3fc"/>
      </g>
      <g transform="translate(1078 510)">
        <circle r="46" fill="#172554" fill-opacity="0.36" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.72"/>
        <circle r="12" fill="#bfdbfe"/>
      </g>
      <g transform="translate(1224 310)">
        <circle r="50" fill="#312e81" fill-opacity="0.32" stroke="#a78bfa" stroke-width="2.6" stroke-opacity="0.72"/>
        <circle r="13" fill="#c4b5fd"/>
      </g>
      <g transform="translate(1490 176)">
        <circle r="56" fill="#4c1d95" fill-opacity="0.28" stroke="#c4b5fd" stroke-width="2.8" stroke-opacity="0.72"/>
        <circle r="15" fill="#ede9fe"/>
      </g>
    </g>

    <g opacity="0.30" fill="none" stroke="#94a3b8" stroke-width="1.3">
      <circle cx="780" cy="420" r="210"/>
      <circle cx="1054" cy="380" r="250"/>
      <circle cx="1224" cy="310" r="146"/>
    </g>
  </g>

  <g transform="translate(140 1850)">
    <text x="0" y="0" fill="#e2e8f0" font-size="34" font-weight="800" letter-spacing="1.4">从隔离边界到全局连接</text>
    <text x="0" y="64" fill="#94a3b8" font-size="28" letter-spacing="1.1">在约束中重写连接方式</text>
  </g>

  <g transform="translate(140 2200)">
    <line x1="0" y1="0" x2="1320" y2="0" stroke="url(#lineGrad)" stroke-width="3"/>
    <text x="0" y="78" fill="#f8fafc" font-size="42" font-weight="800" letter-spacing="1.5">caozhiyi</text>
    <text x="1320" y="78" text-anchor="end" fill="#94a3b8" font-family="'SFMono-Regular', 'Cascadia Code', 'Menlo', monospace" font-size="24" letter-spacing="3">BOUNDARY · FLOW · FABRIC · GLOBAL</text>
  </g>

  <g opacity="0.38" filter="url(#glow)">
    <circle cx="1314" cy="360" r="5" fill="#86efac"/>
    <circle cx="1370" cy="430" r="4" fill="#38bdf8"/>
    <circle cx="1240" cy="520" r="4" fill="#a78bfa"/>
    <circle cx="1150" cy="350" r="3" fill="#22c55e"/>
    <path d="M1150 350 L1314 360 L1370 430 L1240 520 Z" fill="none" stroke="#86efac" stroke-width="1.5" stroke-opacity="0.42"/>
  </g>
</svg>
