name: Deploy to GitHub Pages

on:
  # 触发条件：当推送代码到 main 或 master 分支时
  push:
    branches: [ main, master ]
  # 允许手动触发
  workflow_dispatch:

# 权限设置，允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 并发限制：如果前一次部署还在运行，取消它，保证只有最新的部署生效
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  BUILD_PATH: "." # 项目根目录

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # quicX 文档站（/docs/quicx/）内容源头：构建期拉取，不进本仓库
      # 注意：quicX 文档更新后需手动 workflow_dispatch 触发本 workflow 重新部署
      - name: Checkout quicX docs source
        uses: actions/checkout@v4
        with:
          repository: caozhiyi/quicX
          ref: main
          path: quicx-repo
          sparse-checkout: docs
          fetch-depth: 1

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=pnpm" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build with Astro
        run: |
          ${{ steps.detect-package-manager.outputs.runner }} astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        working-directory: ${{ env.BUILD_PATH }}

      # docs-site 使用 Astro 7 + Starlight，要求 Node >= 22.12（主站保持 Node 20）
      - name: Setup Node for docs-site
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Build QuicX docs site
        run: |
          npm ci
          # mermaid 构建期渲染需要 Playwright chromium（--with-deps 顺带装系统库）
          npx playwright install chromium --with-deps
          node scripts/inject-content.mjs "${{ github.workspace }}/quicx-repo/docs" src/content/docs
          npm run build
          mkdir -p "${{ github.workspace }}/dist/docs/quicx"
          cp -r dist/. "${{ github.workspace }}/dist/docs/quicx/"
        working-directory: docs-site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
